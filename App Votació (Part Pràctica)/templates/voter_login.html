<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accés Votant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">TDR - Marçal Maresma Roig</div>
        <a href="/" class="back-link">← Tornar a l'inici</a>
        <h1>Accés Votant</h1>
        
        <div id="alert-container"></div>
        
        <form id="voter-login-form">
            <div class="form-group">
                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni" required>
            </div>
            
            <div class="form-group">
                <label for="nom">Nom:</label>
                <input type="text" id="nom" name="nom" required>
            </div>
            
            <div class="form-group">
                <label for="codi_votacio">Codi de Votació:</label>
                <input type="text" id="codi_votacio" name="codi_votacio" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Accedir a la Votació</button>
        </form>
    </div>
    
    <script src="{{ url_for('static', filename='js/voter_login.js') }}"></script>
</body>
</html>
