<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Votació</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <a href="/admin/panel" class="back-link">← Tornar al panell</a>
        <h1>Crear Nova Votació</h1>
        
        <div id="alert-container"></div>
        
        <form id="create-poll-form">
            <div class="form-group">
                <label for="titol">Títol de la Votació:</label>
                <input type="text" id="titol" name="titol" required>
            </div>
            
            <div class="form-group">
                <label for="descripcio">Descripció (opcional):</label>
                <textarea id="descripcio" name="descripcio"></textarea>
            </div>
            
            <h2>Opcions de Votació</h2>
            <div id="options-container" class="options-list">
                <div class="option-item">
                    <input type="text" class="option-input" placeholder="Opció 1" required>
                    <button type="button" class="btn btn-danger" onclick="removeOption(this)" style="display: none;">Eliminar</button>
                </div>
                <div class="option-item">
                    <input type="text" class="option-input" placeholder="Opció 2" required>
                    <button type="button" class="btn btn-danger" onclick="removeOption(this)">Eliminar</button>
                </div>
            </div>
            
            <button type="button" class="btn btn-secondary" onclick="addOption()">➕ Afegir Opció</button>
            
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">
                Crear Votació
            </button>
        </form>
    </div>
    
    <script src="{{ url_for('static', filename='js/create_poll.js') }}"></script>
</body>
</html>
